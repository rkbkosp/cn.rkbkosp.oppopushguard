name: Signed release

on:
  push:
    tags: ['*-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Check release tag
        shell: bash
        run: |
          version_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*$/\1/p' app/build.gradle.kts | head -n 1)
          version_name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*$/\1/p' app/build.gradle.kts | head -n 1)
          expected_tag="${version_code}-${version_name}"
          if [[ -z "$version_code" || -z "$version_name" || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag '$GITHUB_REF_NAME' must match '$expected_tag' from app/build.gradle.kts" >&2
            exit 1
          fi
      - name: Build unsigned release APK
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Sign and verify APK
        env:
          OPPO_PUSH_KEYSTORE_BASE64: ${{ secrets.OPPO_PUSH_KEYSTORE_BASE64 }}
          OPPO_PUSH_KEYSTORE_PASSWORD: ${{ secrets.OPPO_PUSH_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${OPPO_PUSH_KEYSTORE_BASE64:?Missing OPPO_PUSH_KEYSTORE_BASE64 repository secret}"
          : "${OPPO_PUSH_KEYSTORE_PASSWORD:?Missing OPPO_PUSH_KEYSTORE_PASSWORD repository secret}"
          keystore_path="$RUNNER_TEMP/rkbkosp-release.p12"
          trap 'rm -f "$keystore_path"' EXIT
          printf '%s' "$OPPO_PUSH_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="app/build/outputs/apk/release/OppoPushGuard-${GITHUB_REF_NAME}.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" sign \
            --ks "$keystore_path" \
            --ks-type PKCS12 \
            --ks-key-alias rkbkosp \
            --ks-pass env:OPPO_PUSH_KEYSTORE_PASSWORD \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$apksigner" verify --verbose --print-certs "$signed_apk"
          actual_fingerprint=$("$apksigner" verify --print-certs "$signed_apk" | awk -F ': ' '/certificate SHA-256 digest:/ { print tolower($2); exit }')
          expected_fingerprint='59ea4ac3a16001cf66899275068c39c4ae5fbeab74537305a8bb7f5f51063263'
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "Unexpected signing certificate: $actual_fingerprint" >&2
            exit 1
          fi
          (cd "$(dirname "$signed_apk")" && sha256sum "$(basename "$signed_apk")" > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "app/build/outputs/apk/release/OppoPushGuard-${GITHUB_REF_NAME}.apk" \
            "app/build/outputs/apk/release/SHA256SUMS" \
            --verify-tag \
            --title "OPPO Push Guard ${GITHUB_REF_NAME}" \
            --generate-notes
